# Add to postgresql.conf (or conf.d/). Continuous WAL archiving for point-in-time recovery.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=source-connect archive-push %p'
# Force a WAL segment switch at least every 5 minutes when there is activity, so the newest changes
# reach off-site storage quickly (design RPO <= 15 minutes; measured in the drill).
archive_timeout = 300
max_wal_senders = 3
# Never listen on the public internet.
listen_addresses = 'localhost'
